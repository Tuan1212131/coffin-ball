name: Build autocof.so
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Compile
        run: |
          NDK=$ANDROID_HOME/ndk/27.2.12479018
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang -shared -fPIC -O2 -o autocof.so autocof/autocof.c -llog
          file autocof.so
      - uses: actions/upload-artifact@v4
        with: { name: autocof-so, path: autocof.so }
